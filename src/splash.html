<!doctype html>

<title>Encyclopedia 2000</title>

<body>
<svg class="bg" viewBox="0 0 640 400" aria-hidden="true">
  <defs>
    <radialGradient id="sb0" cx="50%" cy="38%" r="80%"><stop offset="0" stop-color="#4f78c4"/><stop offset=".45" stop-color="#25458a"/><stop offset="1" stop-color="#0b1a40"/></radialGradient>
    <radialGradient id="pet" cx="50%" cy="85%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#cfe0ff" stop-opacity=".22"/><stop offset=".92" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="core" cx="50%" cy="50%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#dbe8ff" stop-opacity=".6"/><stop offset="1" stop-color="#9db8ff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset=".42" stop-color="#0b1a40" stop-opacity="0"/><stop offset=".68" stop-color="#0b1a40" stop-opacity=".72"/><stop offset="1" stop-color="#081430" stop-opacity=".92"/></linearGradient>
    <filter id="glint" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#sb0)"/>
  <g transform="translate(320 150)" filter="url(#soft)"><g class="spin" id="petals"></g></g>
  <circle class="core" cx="320" cy="150" r="95" fill="url(#core)" filter="url(#softer)"/>
  <rect width="640" height="400" fill="url(#shade)"/>
  <g class="arcs" fill="none" stroke="#9fc0ff">
    <path d="M 200 -20 C 90 120 110 300 230 420" stroke-opacity=".22" stroke-width="1.2"/>
    <path d="M 440 -20 C 550 120 530 300 410 420" stroke-opacity=".18" stroke-width="1.2"/>
  </g>
  <g transform="translate(320 150)"><path class="spark" filter="url(#glint)" fill="#fff" d="M0 -70 L5 -5 L70 0 L5 5 L0 70 L-5 5 L-70 0 L-5 -5Z"/></g>
</svg>

<img class="emblem" src="icon.svg" alt="">

<div class="title">
  <div class="e">Encyclopedia</div>
  <div class="y">2000</div>
  <div class="tag">THE WORLD OF KNOWLEDGE</div>
</div>
