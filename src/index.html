<div id="app">
  <div class="titlebar">
    <img class="emb" src="icon-small.svg" alt="">
    <span class="tt">Encyclopedia 2000</span>
    <div class="wc">
      <button data-win="min" title="Minimize"><svg class="wi" viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
      <button data-win="max" title="Maximize" id="maxbtn"><svg class="wi" viewBox="0 0 10 10"><path d="M.5.5h9v9h-9z"/></svg></button>
      <button data-win="close" class="close" title="Close"><svg class="wi x" viewBox="0 0 10 10"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg></button>
    </div>
  </div>

  <div class="menubar" id="menubar"></div>

  <div class="toolbar" id="toolbar">
    <button class="tbtn lbl home-btn" data-cmd="home" title="Home (Ctrl+H)"><img src="icon-small.svg" alt="">Home</button>
    <span class="tsep"></span>
    <button class="tbtn" data-cmd="back" title="Back (Alt+Left)"><svg class="ic"><use href="#i-back"/></svg></button>
    <button class="tbtn" data-cmd="fwd" title="Forward (Alt+Right)"><svg class="ic"><use href="#i-fwd"/></svg></button>
    <span class="tsep"></span>
    <div class="find">
      <label for="q">Find</label>
      <div class="field" id="field">
        <input id="q" autocomplete="off" spellcheck="false" placeholder="Type a subject">
        <button class="dd" id="qdd" title="Recently viewed" tabindex="-1">&#x25BC;</button>
        <div class="suggest" id="suggest" hidden></div>
      </div>
      <button class="go" id="go" title="Show search results">Search</button>
    </div>
    <span class="tsep"></span>
    <button class="tbtn lbl" data-cmd="explore" title="Explore articles"><svg class="ic"><use href="#i-book"/></svg>Articles</button>
    <button class="tbtn lbl" data-cmd="gallery" title="Picture of the Day gallery"><svg class="ic"><use href="#i-film"/></svg>Media</button>
    <button class="tbtn lbl" data-cmd="onthisday" title="On this day in history"><svg class="ic"><use href="#i-clock"/></svg>Timeline</button>
    <button class="tbtn lbl" data-cmd="random" title="Open a random article"><svg class="ic"><use href="#i-dice"/></svg>Random</button>
    <span class="tsep"></span>
    <button class="tbtn lbl" data-cmd="favpane" title="Show your Favorites (Ctrl+I)"><svg class="ic"><use href="#i-favs"/></svg>Favorites</button>
    <button class="tbtn" data-cmd="speak" title="Read Aloud"><svg class="ic"><use href="#i-read"/></svg></button>
    <button class="tbtn" data-cmd="copy" title="Copy (Ctrl+C)"><svg class="ic"><use href="#i-copy"/></svg></button>
    <button class="tbtn" data-cmd="print" title="Print Preview (Ctrl+P)"><svg class="ic"><use href="#i-print"/></svg></button>
    <div class="vol" id="vol">
      <button class="tbtn" id="volbtn" title="Volume"><svg class="ic"><use href="#i-vol"/></svg></button>
      <div class="volpop" id="volpop" hidden>
        <div class="vh">Volume</div>
        <div class="vrow">
          <button class="tbtn" id="volmute" title="Mute"><svg class="ic"><use href="#i-vol"/></svg></button>
          <input type="range" id="volrange" min="0" max="100" step="1" aria-label="Volume">
          <span id="volpct">100%</span>
        </div>
        <div class="vnote">Startup sound, clicks, games, and Read Aloud</div>
      </div>
    </div>
  </div>

  <nav class="crumbs" id="crumbs" aria-label="Location" hidden></nav>
  <div class="stage">
    <main id="view"></main>
    <aside class="fpane" id="fpane" aria-label="Favorites" hidden></aside>
  </div>

  <div class="statusbar">
    <div class="sb grow" id="status">Ready</div>
    <div class="sb upd" id="updatebar" hidden></div>
    <div class="sb" id="betabar"><span class="beta">BETA</span><a href="#" class="sup" id="feedback-link" title="Report a problem or share an idea">Send feedback</a></div>
    <div class="sb">Content from Wikipedia · CC BY-SA · <a href="#" class="sup" id="support" title="Donate to Wikipedia, or tip the developer">♥ Donate</a></div>
    <div class="sb"><span class="dot" id="netdot"></span><span id="net">Online</span></div>
    <div class="sb" id="clock"></div>
  </div>
</div>

<script src="bloom.js"></script>
<script src="themes.js"></script>
<script src="audio.js"></script>

<script src="activities/registry.js"></script>

<script src="activities/world-clock.js"></script>
<script src="activities/almanac-calendar.js"></script>

<script src="options.js"></script>
<script src="version.js"></script>
<script src="app.js"></script>
</body>
</html>
